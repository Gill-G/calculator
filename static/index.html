<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <script>
      // Runs before first paint so a saved light theme doesn't flash dark,
      // and a saved 3D setting doesn't flash flat.
      (function () {
        try {
          if (localStorage.getItem("calculator-depth") === "on") {
            document.documentElement.setAttribute("data-depth", "on");
          }
        } catch (e) {}
        try {
          var saved = localStorage.getItem("calculator-theme");
          if (saved) {
            document.documentElement.setAttribute("data-theme", saved);
            return;
          }
        } catch (e) {}
        try {
          if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- React from a CDN so the app needs no build step and no npm install. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
    <script type="text/babel" data-presets="react" src="app.jsx"></script>
  </body>
</html>
